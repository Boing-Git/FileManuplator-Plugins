- target: csv_split
  mime_types: ["text/csv"]
  description: "Splits massive CSV files into 100k-row chunks while preserving the header row."
  actions:
    - type: split_csv
      chunk_size: "100000"
      output_pattern: "{output.dir}/{file.stem}_part_"

- target: csv_join
  mime_types: ["text/csv"]
  description: "Joins CSV chunk files back together into a single file while deduplicating headers."
  actions:
    - type: join_csv

