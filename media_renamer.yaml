target: media_clean_names
mime_types: ["video/*"]
description: "Sanitizes release & codec tags from video filenames for Plex/Jellyfin libraries."

actions:
  - type: regex_copy
    rules:
      # Replace dots with spaces (excluding the final extension dot by targeting stem parts)
      - pattern: "\\."
        replacement: " "
      # Remove release tags and everything after
      - pattern: "\\b(1080p|720p|2160p|4k|x264|x265|h264|hevc|webrip|web-dl|bluray|aac|ac3|dts|remux)\\b.*"
        replacement: ""
      # Clean trailing dashes and spaces
      - pattern: "[\\-\\s]+$"
        replacement: ""
      # The previous steps stripped the extension, so add it back
      - pattern: "$"
        replacement: "{file.ext}"
