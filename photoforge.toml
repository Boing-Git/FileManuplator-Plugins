target = "photoforge"
mime_types = ["image/*"]

[plugin]
name = "PhotoForge"
version = "1.0"
description = "Native port of PhotoForge. Resize, crop, and compress photos to exact dimensions and file size."
change_extension = false

[tab]
title = "PhotoForge"
icon = "image-x-generic-symbolic"

[[ui]]
type = "file_picker"
id = "input_file"
label = "Select Input Image"

[[ui]]
type = "picker"
id = "preset_size"
label = "Preset Size"
options = [
    "Original Size",
    "Large Image {3000x2000}",
    "Medium Image {1500x1000}",
    "Small Image {800x600}",
    "Avatar {400x400}"
]
default = "Original Size"
overwrites = ["width", "height"]

[[ui]]
type = "radio_group"
id = "crop_mode"
label = "Crop Options"
options = ["Freeform", "Locked to Aspect Ratio", "Reset Cropping"]
default = "Freeform"

[[ui]]
type = "image_canvas"
id = "preview_canvas"
image_source = "{file.path}"
lock_aspect_ratio = "{crop_mode}"
aspect_ratio_source = "{preset_size}"
show_grid = true
shade_outside = 0.5
show_handles = true
draggable_selection = true
lock_inside_image = true

[[ui]]
type = "text_input"
id = "width"
label = "Target Width (px)"
default = "420"

[[ui]]
type = "text_input"
id = "height"
label = "Target Height (px)"
default = "525"

[[ui]]
type = "picker"
id = "fit_mode"
label = "Fit Mode"
options = ["Contain", "Cover", "Stretch"]
default = "Cover"

[[ui]]
type = "slider"
id = "target_size"
label = "Target File Size (KB)"
min = 10.0
max = 1000.0
default = 200.0

[[ui]]
type = "button"
id = "apply_btn"
label = "Convert & Compress"
on_click = "execute_pipeline"

[pipeline]
# Built in, so PhotoForge needs no ImageMagick and runs on phones too:
# crop to the canvas selection, fit to the target size, then pick the highest
# JPEG quality under the size budget (lossless formats ignore max_kb).
[[pipeline.process]]
step = 1
action = "export_image"
target_file = "{file.path}"
output_file = "{output.path}"
crop_data = "{preview_canvas.crop_data}"
width = "{width}"
height = "{height}"
fit = "{fit_mode}"
max_kb = "{target_size}"
