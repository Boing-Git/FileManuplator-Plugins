target: smart_sort
mime_types: ["*/*"]
description: "Automatically organizes files into categorized subfolders by MIME type."

actions:
  - type: shell
    command: |
      EXT="{file.ext}"
      MIME="{file.mime}"
      DIR="Others"
      if [[ "$MIME" == image/* ]]; then DIR="Images"
      elif [[ "$MIME" == video/* ]]; then DIR="Videos"
      elif [[ "$MIME" == audio/* ]]; then DIR="Audio"
      elif [[ "$MIME" == text/* || "$EXT" == ".pdf" || "$EXT" == ".docx" ]]; then DIR="Documents"
      elif [[ "$EXT" == ".zip" || "$EXT" == ".tar.gz" || "$EXT" == ".rar" || "$EXT" == ".7z" ]]; then DIR="Archives"
      elif [[ "$EXT" == ".exe" || "$EXT" == ".deb" || "$EXT" == ".rpm" || "$EXT" == ".AppImage" ]]; then DIR="Installers"
      fi
      mkdir -p "{output.dir}/$DIR"
      cp '{file.path}' "{output.dir}/$DIR/{file.name}"
