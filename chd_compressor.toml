target = "chd_compress"
mime_types = [ "application/x-cd-image", "application/x-iso9660-image", "application/octet-stream", "*/*",]

[plugin]
name = "Chd Compress"
version = "1.0"
description = "Losslessly compresses raw disc images (ISO, BIN/CUE) to CHD format for emulators."

[pipeline]
[[pipeline.process]]
step = 1
action = "chdman"
args = "createcd -i '{file.path}' -o '{output.dir}/{file.stem}.chd'"

